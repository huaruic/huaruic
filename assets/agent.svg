<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" role="img" aria-label="An agent answers 'who is Ernest?': backend engineer at Hupu, ByteDance and Xiaohongshu; now builds AI tools and encrypted dApps on his own. Projects are listed below.">
  <style>
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .dim { fill: #7d8590; } .w { fill: #e6edf3; } .g { fill: #3fb950; } .y { fill: #ffd200; } .p { fill: #d2a8ff; } .b { fill: #79c0ff; }
    @keyframes type  { to { transform: translateX(134.4px); } }
    @keyframes wipe  { to { transform: translateX(720px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes hide  { to { opacity: 0; } }
    @keyframes show  { to { opacity: 1; } }
    @keyframes spin  { to { transform: rotate(360deg); } }
    .q      { animation: type .8s steps(14) .4s forwards; }
    .cur1   { animation: blink 1s steps(1) infinite, hide 0s 1.2s forwards; }
    .in     { opacity: 0; animation: show .01s forwards; }
    .spin   { transform-box: fill-box; transform-origin: center; animation: spin .7s linear infinite, hide 0s forwards; }
    .line   { animation: wipe .6s linear forwards; }
    .cur2   { animation: blink 1s steps(1) infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; } }
  </style>
  <defs><clipPath id="win"><rect width="840" height="300" rx="12"/></clipPath></defs>

  <g clip-path="url(#win)">
    <rect width="840" height="300" fill="#0d1117"/>
    <rect width="840" height="36" fill="#161b22"/>
    <circle cx="22" cy="18" r="6" fill="#ff5f57"/><circle cx="42" cy="18" r="6" fill="#febc2e"/><circle cx="62" cy="18" r="6" fill="#28c840"/>
    <text x="420" y="23" text-anchor="middle" class="m dim" font-size="13">huaruic/agent  ·  reads my repos, contracts and resume</text>
  </g>
  <rect x=".5" y=".5" width="839" height="299" rx="12" fill="none" stroke="#30363d"/>

  <!-- question -->
  <g class="m" font-size="16">
    <text x="40" y="80" class="b">you</text>
    <text x="110" y="80" class="w" textLength="134.4" lengthAdjust="spacing">who is Ernest?</text>
    <g class="q">
      <rect x="110" y="62" width="150" height="24" fill="#0d1117"/>
      <rect class="cur1" x="110" y="65" width="9" height="19" fill="#e6edf3"/>
    </g>
  </g>

  <!-- tool calls: spinner, then result -->
  <g class="m" font-size="14">
    <g class="in" style="animation-delay:1.3s">
      <text x="110" y="116"><tspan class="p">call</tspan> <tspan class="dim">github.repos("huaruic")</tspan></text>
      <circle class="spin" cx="536" cy="111" r="6" fill="none" stroke="#7d8590" stroke-width="2" stroke-dasharray="26 12" style="animation-delay:0s,2s"/>
    </g>
    <text x="530" y="116" class="in g" style="animation-delay:2s">49 public repos</text>

    <g class="in" style="animation-delay:1.6s">
      <text x="110" y="142"><tspan class="p">call</tspan> <tspan class="dim">fhevm.read("zamadrop")</tspan></text>
      <circle class="spin" cx="536" cy="137" r="6" fill="none" stroke="#7d8590" stroke-width="2" stroke-dasharray="26 12" style="animation-delay:0s,2.4s"/>
    </g>
    <text x="530" y="142" class="in y" style="animation-delay:2.4s">amounts: encrypted</text>

    <g class="in" style="animation-delay:1.9s">
      <text x="110" y="168"><tspan class="p">call</tspan> <tspan class="dim">resume.grep("hackathon")</tspan></text>
      <circle class="spin" cx="536" cy="163" r="6" fill="none" stroke="#7d8590" stroke-width="2" stroke-dasharray="26 12" style="animation-delay:0s,2.8s"/>
    </g>
    <text x="530" y="168" class="in g" style="animation-delay:2.8s">9+ entered, 5 awards</text>
  </g>

  <!-- answer, streamed line by line -->
  <g class="m" font-size="15">
    <text x="40" y="212" class="in g" style="animation-delay:3s">agent</text>
    <text x="110" y="212" class="w">Backend engineer at Hupu, ByteDance and Xiaohongshu. Now builds AI</text>
    <text x="110" y="238" class="w">tools and encrypted dApps on his own. Projects are listed below.</text>
    <rect class="line" x="104" y="196" width="720" height="24" fill="#0d1117" style="animation-delay:3.1s"/>
    <rect class="line" x="104" y="222" width="720" height="24" fill="#0d1117" style="animation-delay:3.7s"/>
  </g>

  <g class="in" style="animation-delay:4.4s">
    <text x="40" y="276" class="m b" font-size="16">you</text>
    <rect class="cur2" x="110" y="261" width="9" height="19" fill="#e6edf3"/>
    <text x="134" y="276" class="m dim" font-size="14">your turn. open an issue titled "ask: ..."</text>
  </g>
</svg>

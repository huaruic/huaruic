name: heatmap

on:
  schedule:
    - cron: "0 16 * * *" # 00:00 Beijing time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-write
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node heatmap/gen.mjs huaruic
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: |
          git config user.name "huaruic-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u assets/heatmap.svg
          git diff --cached --quiet || { git commit -m "chore(heatmap): redraw contributions" && git push; }

<svg xmlns="http://www.w3.org/2000/svg" width="840" height="470" viewBox="0 0 840 470" role="img" aria-label="Hackathon results: Top 5 at Zama FHE Hackathon; 3rd at AO Hacker House Hangzhou; winner at Zhouzhousong Shanghai; Top 10 at Virtuals Hackathon; BNB AI Hacker award; picked to pitch at ETH Hangzhou.">
  <style>
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .s { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    @keyframes slide { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
    @keyframes pop   { 0% { transform: scale(0); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }
    @keyframes shine { from { transform: translateX(-160px); } to { transform: translateX(900px); } }
    @keyframes fill  { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes count { from { opacity: 0; } to { opacity: 1; } }
    .row  { opacity: 0; animation: slide .45s cubic-bezier(.2,.8,.2,1) forwards; }
    .icon { transform-box: fill-box; transform-origin: center; transform: scale(0); animation: pop .4s ease-out forwards; }
    .glint{ transform: translateX(-160px); animation: shine .9s ease-in-out forwards; }
    .xp   { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: fill 2.8s ease-out .3s forwards; }
    .done { opacity: 0; animation: count .3s 3.1s forwards; }
    @media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; animation-delay: 0s !important; } }
  </style>
  <defs>
    <linearGradient id="gl" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="760" height="56" rx="28"/></clipPath>
    <g id="cardbg">
      <rect width="760" height="56" rx="28" fill="#161b22" stroke="#30363d"/>
      <circle cx="28" cy="28" r="22" fill="#21262d" stroke="#ffd200" stroke-width="2"/>
    </g>
  </defs>

  <rect width="840" height="470" rx="12" fill="#0d1117"/>
  <rect x=".5" y=".5" width="839" height="469" rx="12" fill="none" stroke="#30363d"/>

  <!-- header + XP bar -->
  <text x="40" y="42" class="m" font-size="15" fill="#e6edf3">hackathons.log</text>
  <rect x="330" y="30" width="370" height="14" rx="7" fill="#21262d"/>
  <rect class="xp" x="330" y="30" width="370" height="14" rx="7" fill="#ffd200"/>
  <text x="712" y="42" class="m done" font-size="14" fill="#ffd200">6/6 · 600G</text>

  <!-- rows: y = 64 + i*66, delay = .25 + i*.45 -->
  <g transform="translate(40 64)"><g class="row" style="animation-delay:0.25s">
    <use href="#cardbg"/><text x="28" y="31.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffd200" class="m icon" style="animation-delay:0.45s">TOP5</text>
    <text x="64" y="22" class="m" font-size="10" fill="#ffd200" letter-spacing="1.5">ACHIEVEMENT UNLOCKED</text>
    <text x="64" y="42" class="s" font-size="16" font-weight="600" fill="#e6edf3">Top 5, Zama FHE Hackathon <tspan font-weight="400" fill="#7d8590">· ZamaDrop + ZamaVote, built solo</tspan></text>
    <text x="736" y="35" text-anchor="end" class="m" font-size="14" fill="#ffd200">G 100</text>
    <g clip-path="url(#card)"><rect class="glint" width="140" height="56" fill="url(#gl)" style="animation-delay:0.60s"/></g>
  </g></g>
  <g transform="translate(40 130)"><g class="row" style="animation-delay:0.70s">
    <use href="#cardbg"/><text x="28" y="32" text-anchor="middle" font-size="11" font-weight="700" fill="#ffd200" class="m icon" style="animation-delay:0.90s">3RD</text>
    <text x="64" y="22" class="m" font-size="10" fill="#ffd200" letter-spacing="1.5">ACHIEVEMENT UNLOCKED</text>
    <text x="64" y="42" class="s" font-size="16" font-weight="600" fill="#e6edf3">3rd place, AO Hacker House Hangzhou <tspan font-weight="400" fill="#7d8590">· prize: a pitch slot at Token2049 SG</tspan></text>
    <text x="736" y="35" text-anchor="end" class="m" font-size="14" fill="#ffd200">G 100</text>
    <g clip-path="url(#card)"><rect class="glint" width="140" height="56" fill="url(#gl)" style="animation-delay:1.05s"/></g>
  </g></g>
  <g transform="translate(40 196)"><g class="row" style="animation-delay:1.15s">
    <use href="#cardbg"/><text x="28" y="32" text-anchor="middle" font-size="11" font-weight="700" fill="#ffd200" class="m icon" style="animation-delay:1.35s">1ST</text>
    <text x="64" y="22" class="m" font-size="10" fill="#ffd200" letter-spacing="1.5">ACHIEVEMENT UNLOCKED</text>
    <text x="64" y="42" class="s" font-size="16" font-weight="600" fill="#e6edf3">Winner, Zhouzhousong Shanghai Hackathon <tspan font-weight="400" fill="#7d8590">· Open Memory, local-first AI memory</tspan></text>
    <text x="736" y="35" text-anchor="end" class="m" font-size="14" fill="#ffd200">G 100</text>
    <g clip-path="url(#card)"><rect class="glint" width="140" height="56" fill="url(#gl)" style="animation-delay:1.50s"/></g>
  </g></g>
  <g transform="translate(40 262)"><g class="row" style="animation-delay:1.60s">
    <use href="#cardbg"/><text x="28" y="31.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffd200" class="m icon" style="animation-delay:1.80s">TOP10</text>
    <text x="64" y="22" class="m" font-size="10" fill="#ffd200" letter-spacing="1.5">ACHIEVEMENT UNLOCKED</text>
    <text x="64" y="42" class="s" font-size="16" font-weight="600" fill="#e6edf3">Top 10, Virtuals Hackathon <tspan font-weight="400" fill="#7d8590">· GoHacker.ai with YoubetDAO</tspan></text>
    <text x="736" y="35" text-anchor="end" class="m" font-size="14" fill="#ffd200">G 100</text>
    <g clip-path="url(#card)"><rect class="glint" width="140" height="56" fill="url(#gl)" style="animation-delay:1.95s"/></g>
  </g></g>
  <g transform="translate(40 328)"><g class="row" style="animation-delay:2.05s">
    <use href="#cardbg"/><text x="28" y="32" text-anchor="middle" font-size="11" font-weight="700" fill="#ffd200" class="m icon" style="animation-delay:2.25s">BNB</text>
    <text x="64" y="22" class="m" font-size="10" fill="#ffd200" letter-spacing="1.5">ACHIEVEMENT UNLOCKED</text>
    <text x="64" y="42" class="s" font-size="16" font-weight="600" fill="#e6edf3">BNB AI Hacker award <tspan font-weight="400" fill="#7d8590">· GoHacker.ai</tspan></text>
    <text x="736" y="35" text-anchor="end" class="m" font-size="14" fill="#ffd200">G 100</text>
    <g clip-path="url(#card)"><rect class="glint" width="140" height="56" fill="url(#gl)" style="animation-delay:2.40s"/></g>
  </g></g>
  <g transform="translate(40 394)"><g class="row" style="animation-delay:2.50s">
    <use href="#cardbg"/><text x="28" y="32" text-anchor="middle" font-size="11" font-weight="700" fill="#ffd200" class="m icon" style="animation-delay:2.70s">ETH</text>
    <text x="64" y="22" class="m" font-size="10" fill="#ffd200" letter-spacing="1.5">ACHIEVEMENT UNLOCKED</text>
    <text x="64" y="42" class="s" font-size="16" font-weight="600" fill="#e6edf3">Picked to pitch, ETH Hangzhou <tspan font-weight="400" fill="#7d8590">· Memory Orb, team of five</tspan></text>
    <text x="736" y="35" text-anchor="end" class="m" font-size="14" fill="#ffd200">G 100</text>
    <g clip-path="url(#card)"><rect class="glint" width="140" height="56" fill="url(#gl)" style="animation-delay:2.85s"/></g>
  </g></g>
</svg>
